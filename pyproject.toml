[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fixwire"
description = "Fixwire SDK for Python: errors, traces and AI agents, with sync and async clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["urllib3>=1.26.11"]
dynamic = ["version"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Framework :: Celery",
  "Framework :: Django",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://fixwire.io"
Source = "https://github.com/fixwire/fixwire-python"
Issues = "https://github.com/fixwire/fixwire-python/issues"
Changelog = "https://github.com/fixwire/fixwire-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
async = ["httpx>=0.27"]

# `uv sync` installs dev, which is both; CI installs the same groups. The
# tests drive the frameworks the integrations support, the AI clients the
# wrappers trace and OpenTelemetry; lint adds the formatter and the type
# checkers (django-stubs needs Python 3.11, so on 3.10 only the tests run).
[dependency-groups]
test = ["pytest>=8", "httpx>=0.27", "starlette>=0.40", "fastapi>=0.115", "django>=5.0", "celery>=5.4", "flask>=3.0",
        "requests>=2.31", "anthropic>=1.0", "openai>=1.66", "opentelemetry-api>=1.30"]
lint = ["ruff==0.14.7", "mypy>=2.4", "pyright>=1.1.414", "types-requests>=2.31",
        "django-stubs>=6.1; python_version >= '3.11'", "celery-types>=0.26"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.hatch.version]
path = "src/fixwire/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fixwire"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests/typing_check.py", "examples"]

[tool.pyright]
include = ["src", "tests/typing_check.py", "examples"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

# One Python style for Fixwire: compat/ruff.toml and the monorepo's ruff.toml
# extend this.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# printf-style formatting stays where it is used.
ignore = ["UP031"]
