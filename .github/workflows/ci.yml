name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash # on Windows too

# The tests install pyproject.toml's test group at the newest (and, once, the
# oldest) versions it allows, so a new release of a framework breaks here
# first; the checks run from uv.lock, as a contributor's `uv sync` does.
jobs:
  test:
    name: Python ${{ matrix.python }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv pip install -e ".[async]" --group test
      - name: test (the SDK, every integration, the examples against a fake ingest)
        run: python -m pytest -q

  lowest:
    name: Python 3.10, the oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.10"
          activate-environment: true
      - run: uv pip install --resolution lowest-direct -e ".[async]" --group test
      - run: python -m pytest -q

  checks:
    name: format, lint, types, licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          activate-environment: true
      - name: install from uv.lock (fails if it is out of date with pyproject.toml)
        run: uv sync --locked --all-extras
      - run: ruff format --check .
      - run: ruff check .
      - name: types (mypy and pyright, strict)
        run: mypy && pyright
      - run: python tools/license_gate.py
